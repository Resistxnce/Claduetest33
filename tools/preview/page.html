<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Model preview</title>
<style>body { margin: 0; background: #111; }</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const VIEW_W = 640
const VIEW_H = 440
const HEADER = 44

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(VIEW_W, VIEW_H)
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)

const rgb = (c) => new THREE.Color(`rgb(${c[0]},${c[1]},${c[2]})`)
const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`

// Roblox NormalId -> BoxGeometry material slot
const FACE_SLOT = { Right: 0, Left: 1, Top: 2, Bottom: 3, Back: 4, Front: 5 }

function wedgeGeometry(w, h, d) {
  // Roblox wedge: full bottom, full back (+Z) face, slope down to the front (-Z)
  const x = w / 2, y = h / 2, z = d / 2
  const v = [
    [-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], // bottom 0-3
    [-x, y, z], [x, y, z], // top back edge 4-5
  ]
  const tris = [
    [0, 2, 1], [0, 3, 2], // bottom
    [3, 5, 2], [3, 4, 5], // back
    [0, 1, 5], [0, 5, 4], // slope
    [0, 4, 3], // left side
    [1, 2, 5], // right side
  ]
  return fromTris(v, tris)
}

function cornerWedgeGeometry(w, h, d) {
  // Roblox corner wedge: peak above the right-front corner
  const x = w / 2, y = h / 2, z = d / 2
  const v = [[-x, -y, -z], [x, -y, -z], [x, -y, z], [-x, -y, z], [x, y, -z]]
  const tris = [[0, 2, 1], [0, 3, 2], [0, 1, 4], [1, 2, 4], [2, 3, 4], [3, 0, 4]]
  return fromTris(v, tris)
}

function fromTris(v, tris) {
  const pos = []
  for (const t of tris) for (const i of t) pos.push(...v[i])
  const g = new THREE.BufferGeometry()
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3))
  g.computeVertexNormals()
  return g
}

function materialFor(p) {
  const color = rgb(p.c)
  const m = p.m || 'Plastic'
  const opacity = 1 - (p.t || 0)
  const common = { color, transparent: opacity < 0.999, opacity }
  if (m === 'Neon') {
    const glow = color.clone().multiplyScalar(1.9)
    return new THREE.MeshBasicMaterial({ color: glow, transparent: common.transparent, opacity })
  }
  if (m === 'Glass') {
    return new THREE.MeshPhysicalMaterial({ ...common, transparent: true, opacity: Math.min(opacity, 0.45) * 0.9 + 0.08, roughness: 0.05, metalness: 0.1, clearcoat: 1 })
  }
  if (m === 'ForceField') {
    return new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25 * opacity, wireframe: true })
  }
  const metal = ['Metal', 'DiamondPlate', 'CorrodedMetal', 'Foil'].includes(m)
  const shiny = ['SmoothPlastic', 'Marble', 'Granite', 'Ice', 'Glacier'].includes(m)
  const reflect = p.r || 0
  return new THREE.MeshStandardMaterial({
    ...common,
    roughness: metal ? 0.38 : shiny ? 0.5 : 0.85,
    metalness: Math.min(1, (metal ? 0.55 : 0.02) + reflect),
  })
}

// Paints a SurfaceGui (text and frames) onto a canvas for one face
function guiTexture(p, gui, faceW, faceH) {
  const ppsRaw = 40
  let w = Math.max(16, Math.round(faceW * ppsRaw)), h = Math.max(16, Math.round(faceH * ppsRaw))
  const scale = Math.min(1, 1024 / Math.max(w, h))
  w = Math.round(w * scale); h = Math.round(h * scale)
  const canvas = document.createElement('canvas')
  canvas.width = w; canvas.height = h
  const g = canvas.getContext('2d')
  g.fillStyle = css(p.c)
  g.fillRect(0, 0, w, h)
  if (gui.decal === 'face') {
    g.fillStyle = '#1b1b1b'
    g.beginPath(); g.ellipse(w * 0.36, h * 0.38, w * 0.06, h * 0.1, 0, 0, Math.PI * 2); g.fill()
    g.beginPath(); g.ellipse(w * 0.64, h * 0.38, w * 0.06, h * 0.1, 0, 0, Math.PI * 2); g.fill()
    g.lineWidth = Math.max(2, w * 0.05); g.strokeStyle = '#1b1b1b'
    g.beginPath(); g.arc(w * 0.5, h * 0.5, w * 0.24, Math.PI * 0.2, Math.PI * 0.8); g.stroke()
  }
  for (const item of gui.items || []) {
    const x = (item.pos[0] * w + item.pos[1] * scale), y = (item.pos[2] * h + item.pos[3] * scale)
    const iw = (item.size[0] * w + item.size[1] * scale), ih = (item.size[2] * h + item.size[3] * scale)
    if (item.bgT < 1) {
      g.fillStyle = css(item.bg, 1 - item.bgT)
      g.fillRect(x, y, iw, ih)
    }
    if (item.type === 'text' && item.text) {
      const weight = /Black/.test(item.font || '') ? 900 : /Bold/.test(item.font || '') ? 700 : 500
      const lines = String(item.text).replace(/<[^>]+>/g, '').split('\n')
      let size = ih / lines.length
      g.font = `${weight} ${size}px sans-serif`
      const widest = () => Math.max(...lines.map((l) => g.measureText(l).width))
      while (size > 4 && (widest() > iw * 0.98 || size * lines.length > ih)) {
        size *= 0.92
        g.font = `${weight} ${size}px sans-serif`
      }
      g.fillStyle = css(item.color)
      g.textBaseline = 'middle'
      const align = item.align === 'Left' ? 'left' : item.align === 'Right' ? 'right' : 'center'
      g.textAlign = align
      const tx = align === 'left' ? x : align === 'right' ? x + iw : x + iw / 2
      lines.forEach((line, i) => g.fillText(line, tx, y + ih / 2 + (i - (lines.length - 1) / 2) * size))
    }
  }
  const tex = new THREE.CanvasTexture(canvas)
  tex.colorSpace = THREE.SRGBColorSpace
  return tex
}

function faceSize(s, face) {
  if (face === 'Front' || face === 'Back') return [s[0], s[1]]
  if (face === 'Left' || face === 'Right') return [s[2], s[1]]
  return [s[0], s[2]]
}

function meshFor(p) {
  const [sx, sy, sz] = p.s
  let geom
  let mat = materialFor(p)
  const meshType = p.mesh && p.mesh.type
  if (p.head) {
    geom = new THREE.CylinderGeometry(sx * 0.5, sx * 0.5, sy, 28)
  } else if (meshType === 'Sphere' || p.shape === 'Ball') {
    const d = meshType === 'Sphere' ? 1 : Math.min(sx, sy, sz)
    geom = new THREE.SphereGeometry(d / 2, 28, 18)
    if (meshType === 'Sphere') geom.scale(sx, sy, sz)
  } else if (meshType === 'Cylinder') {
    geom = new THREE.CylinderGeometry(0.5, 0.5, 1, 28)
    geom.scale(sx, sy, sz)
  } else if (p.shape === 'Cylinder') {
    const r = Math.min(sy, sz) / 2
    geom = new THREE.CylinderGeometry(r, r, sx, 32)
    geom.rotateZ(-Math.PI / 2)
  } else if (p.shape === 'WedgePart' || p.shape === 'Wedge' || meshType === 'Wedge') {
    geom = wedgeGeometry(sx, sy, sz)
  } else if (p.shape === 'CornerWedgePart' || p.shape === 'CornerWedge') {
    geom = cornerWedgeGeometry(sx, sy, sz)
  } else {
    geom = new THREE.BoxGeometry(sx, sy, sz)
    const guis = (p.gui || []).filter((gui) => gui.items && gui.items.length && FACE_SLOT[gui.face] !== undefined)
    if (guis.length) {
      const mats = [0, 1, 2, 3, 4, 5].map(() => mat)
      for (const gui of guis) {
        const [fw, fh] = faceSize(p.s, gui.face)
        const tex = guiTexture(p, gui, fw, fh)
        const emissive = p.m === 'Neon'
        mats[FACE_SLOT[gui.face]] = emissive
          ? new THREE.MeshBasicMaterial({ map: tex })
          : new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, emissive: new THREE.Color(0xffffff), emissiveMap: tex, emissiveIntensity: 0.55 })
      }
      mat = mats
    }
  }
  const mesh = new THREE.Mesh(geom, mat)
  const cf = p.cf
  const m4 = new THREE.Matrix4().set(cf[3], cf[4], cf[5], cf[0], cf[6], cf[7], cf[8], cf[1], cf[9], cf[10], cf[11], cf[2], 0, 0, 0, 1)
  mesh.matrixAutoUpdate = false
  mesh.matrix.copy(m4)
  const solid = (p.t || 0) < 0.5 && p.m !== 'Neon'
  mesh.castShadow = solid
  mesh.receiveShadow = true
  if (p.head) {
    const face = (p.gui || []).find((gui) => gui.decal === 'face')
    if (face) {
      const tex = guiTexture(p, face, sx, sy)
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(sx * 0.8, sy * 0.8), new THREE.MeshStandardMaterial({ map: tex, transparent: true }))
      plane.position.set(0, 0, -sx * 0.5 - 0.01)
      plane.rotation.y = Math.PI
      mesh.add(plane)
    }
  }
  return mesh
}

function isNight(theme) {
  if (!theme || theme.ClockTime === undefined) return false
  return theme.ClockTime < 6.2 || theme.ClockTime > 18.4
}

function buildScene(data) {
  const scene = new THREE.Scene()
  const root = new THREE.Group()
  const theme = data.themeData
  const night = isNight(theme)
  const kind = data.kind
  // Map views from above leave out the ceiling and anything hung just under it
  let areaXZ = 1
  if (kind === 'map') {
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity
    for (const p of data.parts) {
      minX = Math.min(minX, p.cf[0]); maxX = Math.max(maxX, p.cf[0]); minZ = Math.min(minZ, p.cf[2]); maxZ = Math.max(maxZ, p.cf[2])
    }
    areaXZ = Math.max(1, (maxX - minX) * (maxZ - minZ))
  }
  const isCeiling = (p) => /ceiling|roof|skylight/i.test(p.n) || (p.s[0] * p.s[2] > areaXZ * 0.25 && p.cf[1] > 10)
  let ceilingY = Infinity
  if (kind === 'map') for (const p of data.parts) if (isCeiling(p)) ceilingY = Math.min(ceilingY, p.cf[1] - p.s[1] / 2)
  for (const p of data.parts) {
    if ((p.t || 0) >= 0.98) continue
    const mesh = meshFor(p)
    mesh.userData.overhead = kind === 'map' && (isCeiling(p) || p.cf[1] >= ceilingY - 1.2)
    root.add(mesh)
  }
  scene.add(root)
  root.updateMatrixWorld(true)

  const box = new THREE.Box3()
  root.traverse((o) => { if (o.isMesh) box.expandByObject(o) })
  const center = box.getCenter(new THREE.Vector3())
  const size = box.getSize(new THREE.Vector3())

  const sky = night ? 0x223044 : 0xcfe0ff
  scene.background = new THREE.Color(kind === 'map' ? (night ? 0x0d1220 : 0x9fb8d8) : 0x2a2d35)
  const amb = theme && theme.Ambient ? rgb(theme.Ambient) : new THREE.Color(night ? 0x404a66 : 0x8a8f9a)
  scene.add(new THREE.HemisphereLight(sky, 0x3a3a40, night ? 0.55 : 1.15))
  scene.add(new THREE.AmbientLight(amb, kind === 'map' ? 0.7 : 0.45))
  const sun = new THREE.DirectionalLight(0xffffff, night ? 0.35 : (theme && theme.Brightness ? Math.min(2.4, 0.6 + theme.Brightness * 0.45) : 1.7))
  const span = Math.max(size.x, size.y, size.z)
  sun.position.copy(center).add(new THREE.Vector3(0.55, 1, 0.35).normalize().multiplyScalar(span * 1.5 + 10))
  sun.target.position.copy(center)
  sun.castShadow = true
  const sh = span * 0.75 + 4
  Object.assign(sun.shadow.camera, { left: -sh, right: sh, top: sh, bottom: -sh, near: 0.1, far: span * 4 + 40 })
  sun.shadow.mapSize.set(2048, 2048)
  sun.shadow.bias = -0.0005
  scene.add(sun, sun.target)
  const fill = new THREE.DirectionalLight(0xbcd0ff, 0.45)
  fill.position.copy(center).add(new THREE.Vector3(-0.6, 0.4, -0.8).normalize().multiplyScalar(span + 10))
  scene.add(fill)

  // The part's own lights, strongest first (WebGL can only take so many)
  const lights = []
  for (const p of data.parts) {
    for (const l of p.lights || []) lights.push({ p, l })
  }
  lights.sort((a, b) => b.l.brightness * b.l.range - a.l.brightness * a.l.range)
  for (const { p, l } of lights.slice(0, kind === 'map' ? 12 : 6)) {
    const light = new THREE.PointLight(rgb(l.color), l.brightness * (night ? 6 : 3), l.range * 1.2, 1.2)
    light.position.set(p.cf[0], p.cf[1], p.cf[2])
    scene.add(light)
  }
  return { scene, center, size, box, root }
}

function showOverhead(root, show) {
  root.traverse((o) => { if (o.isMesh && o.userData.overhead) o.visible = show })
}

const VIEWS = {
  side: { dir: [1, 0.08, 0], fov: 22 },
  top: { dir: [0.0001, 1, 0.0001], fov: 30, up: [0, 0, -1] },
  three_quarter: { dir: [-0.85, 0.55, -1], fov: 30 },
  front: { dir: [0, 0.18, -1], fov: 30 },
  back: { dir: [0.2, 0.3, 1], fov: 30 },
  left: { dir: [-1, 0.15, 0], fov: 30 },
  overview: { dir: [0.75, 1.05, 1], fov: 42 },
  ground: { ground: true, fov: 70 },
}
// Guns point along -Z, so their 3/4 view comes from the right and front
const GUN_VIEWS = { three_quarter: { dir: [1, 0.55, -0.75], fov: 22 }, top: { dir: [0.0001, 1, 0.0001], fov: 22, up: [-1, 0, 0] } }

function cameraFor(name, data, center, size, box) {
  const spec = (data.kind === 'gun' && GUN_VIEWS[name]) || VIEWS[name] || VIEWS.three_quarter
  const camera = new THREE.PerspectiveCamera(spec.fov, VIEW_W / VIEW_H, 0.05, 5000)
  if (spec.ground) {
    const hz = (box.max.z - box.min.z) / 2
    camera.position.set(center.x, box.min.y + 7, center.z - hz * 0.78)
    camera.lookAt(center.x, box.min.y + 4, center.z + hz * 0.3)
    return camera
  }
  const dir = new THREE.Vector3(...spec.dir).normalize()
  if (spec.up) camera.up.set(...spec.up)
  // Fit the bounding box: project its corners and back off until they fit
  const corners = []
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners.push(new THREE.Vector3(x, y, z))
  let dist = Math.max(size.x, size.y, size.z) * 2 + 1
  for (let i = 0; i < 40; i++) {
    camera.position.copy(center).addScaledVector(dir, dist)
    camera.lookAt(center)
    camera.updateMatrixWorld(true)
    camera.updateProjectionMatrix()
    let maxN = 0
    for (const c of corners) {
      const n = c.clone().project(camera)
      maxN = Math.max(maxN, Math.abs(n.x), Math.abs(n.y))
    }
    if (maxN > 0.92) dist *= 1.08
    else if (maxN < 0.8) dist *= 0.94
    else break
  }
  return camera
}

window.renderSheet = async function (scenePath) {
  const data = await (await fetch(scenePath)).json()
  const { scene, center, size, box, root } = buildScene(data)
  const views = data.views && data.views.length ? data.views : ['three_quarter']
  const sheet = document.createElement('canvas')
  sheet.width = VIEW_W * views.length
  sheet.height = VIEW_H + HEADER
  const g = sheet.getContext('2d')
  g.fillStyle = '#16181d'
  g.fillRect(0, 0, sheet.width, sheet.height)
  const composer = new EffectComposer(renderer)
  const pass = new RenderPass(scene, null)
  composer.addPass(pass)
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(VIEW_W, VIEW_H), data.kind === 'map' ? 0.45 : 0.55, 0.5, 0.82))
  composer.addPass(new OutputPass())
  views.forEach((name, i) => {
    const camera = cameraFor(name, data, center, size, box)
    showOverhead(root, !(name === 'top' || name === 'overview'))
    pass.camera = camera
    composer.render()
    g.drawImage(renderer.domElement, i * VIEW_W, HEADER)
    g.fillStyle = 'rgba(0,0,0,0.55)'
    g.fillRect(i * VIEW_W + 8, HEADER + 8, 120, 22)
    g.fillStyle = '#fff'
    g.font = '600 14px sans-serif'
    g.fillText(name, i * VIEW_W + 14, HEADER + 24)
  })
  const st = data.stats || {}
  g.fillStyle = '#ff2e63'
  g.fillRect(0, 0, 6, HEADER)
  g.fillStyle = '#ffffff'
  g.font = '800 20px sans-serif'
  g.fillText(data.name, 16, 28)
  g.font = '500 14px sans-serif'
  g.fillStyle = '#b8bcc8'
  const dims = st.size ? `${st.size.map((v) => v.toFixed(1)).join(' x ')} studs` : ''
  const warn = data.warnings && data.warnings.length ? `  |  ${data.warnings.length} warnings` : ''
  g.fillText(`${data.kind}  |  ${st.parts || 0} parts  |  ${dims}${warn}`, 16 + g.measureText(data.name).width * 1.45 + 24, 28)
  return sheet.toDataURL('image/png')
}

window.ready = true
</script>
</body>
</html>
