<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio engine harness</title>
</head>
<body>
<pre id="log">Audio harness — drive via window.renderNote()</pre>
<script type="module">
import { GuitarAudioEngine } from '../../src/audio/engine.js';

/** In-place radix-2 FFT (real input in re, zeros in im). */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr0 = Math.cos(ang), wi0 = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let wr = 1, wi = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi;
        const ai = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr;
        re[i + k + len / 2] = re[i + k] - ar; im[i + k + len / 2] = im[i + k] - ai;
        re[i + k] += ar; im[i + k] += ai;
        const t = wr * wr0 - wi * wi0; wi = wr * wi0 + wi * wr0; wr = t;
      }
    }
  }
}

/**
 * Blind fundamental-frequency estimate from the magnitude spectrum using
 * subharmonic support: the strongest peak is assumed to be harmonic m of the
 * fundamental; the lowest candidate fP/m whose harmonic series is actually
 * populated by spectral peaks wins. This rejects octave errors in both
 * directions. The fundamental peak is refined by parabolic interpolation.
 */
function estimatePitch(samples, sampleRate, { minHz = 40, maxHz = 2500 } = {}) {
  let n = 1;
  while (n * 2 <= samples.length && n < 65536) n *= 2;
  const re = new Float64Array(n), im = new Float64Array(n);
  for (let i = 0; i < n; i++) re[i] = samples[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / n));
  fft(re, im);
  const half = n / 2;
  const db = new Float64Array(half);
  let maxDb = -Infinity, maxBin = 0;
  const binHz = sampleRate / n;
  for (let i = 0; i < half; i++) {
    db[i] = 20 * Math.log10(Math.hypot(re[i], im[i]) + 1e-12);
    if (i * binHz >= minHz && i * binHz <= maxHz * 8 && db[i] > maxDb) { maxDb = db[i]; maxBin = i; }
  }
  // Local maxima above the noise floor
  const peaks = [];
  for (let i = 2; i < half - 2; i++) {
    if (db[i] > db[i - 1] && db[i] >= db[i + 1] && db[i] > maxDb - 42) peaks.push(i);
  }
  const peakNear = (f) => {
    const tol = Math.max(2, f * 0.025 / binHz); // ±2.5 %
    let bestBin = -1;
    for (const p of peaks) if (Math.abs(p - f / binHz) <= tol && (bestBin < 0 || db[p] > db[bestBin])) bestBin = p;
    return bestBin;
  };
  const fP = maxBin * binHz;
  // Subharmonic summation (Hermes): score each candidate f0 = fP/m by the
  // weighted sum of linear magnitudes at its harmonics.
  const lin = (bin) => (bin >= 0 ? Math.pow(10, (db[bin] - maxDb) / 20) : 0);
  let chosenBin = -1, bestScore = -Infinity;
  for (let m = 1; m <= 8; m++) {
    const f0 = fP / m;
    if (f0 < minHz || f0 > maxHz) continue;
    const fundamentalBin = peakNear(f0);
    if (fundamentalBin < 0) continue;
    let score = 0;
    for (let k = 1; k <= 12; k++) score += Math.pow(0.84, k - 1) * lin(peakNear(f0 * k));
    if (score > bestScore) { bestScore = score; chosenBin = fundamentalBin; }
  }
  if (chosenBin < 0) chosenBin = maxBin;
  const b = chosenBin;
  const y0 = db[b - 1], y1 = db[b], y2 = db[b + 1];
  const denom = y0 - 2 * y1 + y2;
  const shift = denom !== 0 ? 0.5 * (y0 - y2) / denom : 0;
  return { frequency: (b + shift) * binHz, clarity: Math.max(0, Math.min(1, (db[b] - (maxDb - 42)) / 42)), fundamentalDb: db[b] - maxDb };
}

function rms(samples) {
  let s = 0;
  for (let i = 0; i < samples.length; i++) s += samples[i] * samples[i];
  return Math.sqrt(s / samples.length);
}

function peak(samples) {
  let p = 0;
  for (let i = 0; i < samples.length; i++) p = Math.max(p, Math.abs(samples[i]));
  return p;
}

/**
 * Render a single plucked note offline and analyse it.
 * @param {object} o
 * @param {number} o.frequency      pitch to synthesise
 * @param {number} [o.lengthFraction=1]
 * @param {number} [o.string=0]
 * @param {number} [o.velocity=0.8]
 * @param {number} [o.duration=2.2]  seconds rendered
 * @param {string} [o.preset]        tone preset id
 * @param {object} [o.params]        param overrides
 * @param {number} [o.pickup]
 * @param {string} [o.body]
 * @param {Array}  [o.events]        extra scheduled calls: [{at, type:'release'|'pluck'|'pitch', ...}]
 */
window.renderNote = async function renderNote(o) {
  const sampleRate = o.sampleRate || 48000;
  const duration = o.duration || 2.2;
  const ctx = new OfflineAudioContext(2, Math.floor(sampleRate * duration), sampleRate);
  const engine = new GuitarAudioEngine();
  await engine.init(ctx);
  // Dry, uncoloured path for measurement unless a preset is requested.
  if (o.preset) engine.setPreset(o.preset);
  const params = { reverb: 0, delay: 0, chorus: 0, gain: 0, distortion: 0, tone: 1, volume: 0.8, ...(o.params || {}) };
  for (const [k, v] of Object.entries(params)) engine.setParam(k, v);
  if (o.pickup) engine.setPickupSelector(o.pickup);
  if (o.body) engine.applyBody(o.body);
  const s = o.string ?? 0;
  const velocity = o.velocity ?? 0.8;
  engine.pluck(s, { velocity, frequency: o.frequency, lengthFraction: o.lengthFraction ?? 1, pickPosition: o.pickPosition ?? 0.13, damping: o.damping, when: 0.05 });
  for (const ev of o.events || []) {
    if (ev.type === 'release') engine.release(ev.string ?? s, { when: ev.at });
    else if (ev.type === 'pluck') engine.pluck(ev.string ?? s, { ...ev, when: ev.at });
    else if (ev.type === 'pitch') engine.setStringPitch(ev.string ?? s, ev.frequency, { glide: ev.glide ?? 0, lengthFraction: ev.lengthFraction ?? 1, when: ev.at });
    else if (ev.type === 'noise') engine.slideNoise(ev.string ?? s, ev.level ?? 0.03, { when: ev.at });
  }
  // Port messages are delivered asynchronously; make sure the worklets have
  // everything before the (very fast) offline render runs.
  await engine.sync();
  const buffer = await ctx.startRendering();
  const data = buffer.getChannelData(0);
  const slice = (t0, t1) => data.subarray(Math.floor(t0 * sampleRate), Math.floor(t1 * sampleRate));
  const analysisStart = o.analysisStart ?? 0.35;
  const analysisEnd = o.analysisEnd ?? Math.min(duration, analysisStart + 0.9);
  const pitch = estimatePitch(slice(analysisStart, analysisEnd), sampleRate, { minHz: 40, maxHz: 2500 });
  const windows = [];
  for (let t = 0.05; t + 0.1 <= duration; t += 0.25) windows.push({ t: +t.toFixed(2), rms: rms(slice(t, t + 0.1)) });
  const measured = pitch.frequency;
  return {
    frequency: o.frequency,
    measured,
    cents: measured > 0 ? 1200 * Math.log2(measured / o.frequency) : null,
    clarity: pitch.clarity,
    fundamentalDb: pitch.fundamentalDb,
    peak: peak(data),
    rmsEarly: rms(slice(0.06, 0.26)),
    rmsLate: rms(slice(duration - 0.3, duration - 0.05)),
    windows,
    sampleRate,
  };
};

document.getElementById('log').textContent += '\nready';
window.__harnessReady = true;
</script>
</body>
</html>
